<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAAG Badge Viewer - No Docker Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .section h2 {
            color: #2c7a3f;
            margin-bottom: 20px;
            border-bottom: 3px solid #2c7a3f;
            padding-bottom: 10px;
        }
        
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .badge-card {
            border: 2px solid;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        
        .badge-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .badge-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .badge-name {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #2d3436;
        }
        
        .badge-category {
            text-align: center;
            font-size: 0.85rem;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .badge-description {
            text-align: center;
            font-size: 0.9rem;
            color: #636e72;
            line-height: 1.4;
        }
        
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .user-card {
            background: linear-gradient(135deg, #f8fdf9 0%, #e8f4ea 100%);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid #2c7a3f;
            box-shadow: 0 4px 15px rgba(44, 122, 63, 0.1);
        }
        
        .user-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c7a3f, #4a9d5f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-right: 15px;
        }
        
        .user-info h3 {
            font-size: 1.3rem;
            color: #2c7a3f;
            margin-bottom: 5px;
        }
        
        .user-specialty {
            font-size: 0.9rem;
            color: #636e72;
            font-style: italic;
        }
        
        .user-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c7a3f;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #636e72;
            text-transform: uppercase;
        }
        
        .user-badges {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .mini-badge {
            padding: 10px 5px;
            border-radius: 10px;
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            transition: transform 0.2s ease;
        }
        
        .mini-badge:hover {
            transform: scale(1.1);
        }
        
        .mini-badge-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .stats-summary {
            background: linear-gradient(135deg, #2c7a3f, #4a9d5f);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .stats-summary h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .summary-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .summary-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .summary-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 HAAG Badge System Viewer</h1>
        
        <div class="section">
            <h2>📋 All Available Badges</h2>
            <div class="badge-grid" id="badgeGrid"></div>
        </div>
        
        <div class="section">
            <h2>👥 User Profiles & Achievements</h2>
            <div class="user-grid" id="userGrid"></div>
            
            <div class="stats-summary">
                <h3>📊 System Statistics</h3>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-number" id="totalBadges">0</div>
                        <div class="summary-label">Total Badges</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-number" id="totalUsers">0</div>
                        <div class="summary-label">Active Users</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-number" id="totalPoints">0</div>
                        <div class="summary-label">Total Points</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-number" id="avgBadges">0</div>
                        <div class="summary-label">Avg Badges/User</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Badge definitions - Full 30 Badge Set
        const badges = {
            // ACADEMIC (3)
            'cs8903-researcher': { name: 'CS8903 Researcher', icon: '🎓', color: '#2980b9', category: 'Academic', description: 'Researcher enrolled in CS8903 Special Problems', points: 50 },
            'cs6999-researcher': { name: 'CS6999 Researcher', icon: '🎯', color: '#f1c40f', category: 'Academic', description: 'Researcher enrolled in CS6999 Master\'s Project', points: 50 },
            'volunteer-researcher': { name: 'Volunteer Researcher', icon: '🤲', color: '#1abc9c', category: 'Academic', description: 'Researcher contributing without course credit', points: 50 },

            // RESEARCH (12)
            'contributor': { name: 'Contributor (Lvl I)', icon: '🗣️', color: '#a5d6a7', category: 'Research', description: 'Posted 10+ research contributions', points: 40 },
            'active-voice': { name: 'Active Voice (Lvl II)', icon: '📢', color: '#66bb6a', category: 'Research', description: 'Posted 30+ research contributions', points: 100 },
            'prolific-debater': { name: 'Prolific Debater (Lvl III)', icon: '🗯️', color: '#43a047', category: 'Research', description: 'Posted 75+ research contributions', points: 250 },
            'research-pillar': { name: 'Research Pillar (Lvl IV)', icon: '🏛️', color: '#1b5e20', category: 'Research', description: 'Posted 150+ research contributions', points: 500 },
            'reader': { name: 'Reader (Lvl I)', icon: '👓', color: '#e1bee7', category: 'Research', description: 'Participated in 3 paper discussions', points: 40 },
            'presenter': { name: 'Presenter (Lvl II)', icon: '🎙️', color: '#ab47bc', category: 'Research', description: 'Presented a paper to the club', points: 120 },
            'session-chair': { name: 'Session Chair (Lvl III)', icon: '⚖️', color: '#8e24aa', category: 'Research', description: 'Led or moderated 3+ paper sessions', points: 300 },
            'curriculum-director': { name: 'Curriculum Director (Lvl IV)', icon: '📚', color: '#4a148c', category: 'Research', description: 'Organized full semester paper schedule', points: 600 },
            'research-pioneer': { name: 'Research Pioneer', icon: '🔬', color: '#2c7a3f', category: 'Research', description: 'Started 5+ distinct research discussions', points: 150 },
            'data-analyst': { name: 'Data Analyst', icon: '📊', color: '#3498db', category: 'Research', description: 'Posted 10+ data analysis insights', points: 80 },
            'field-expert': { name: 'Field Expert', icon: '🌲', color: '#27ae60', category: 'Research', description: 'Shared significant field research experiences', points: 80 },
            'progress-tracker': { name: 'Progress Tracker', icon: '📈', color: '#ff6b35', category: 'Research', description: 'Specialist in tracking research progress', points: 40 },

            // TECHNOLOGY (6)
            'code-artisan': { name: 'Code Artisan', icon: '⚒️', color: '#34495e', category: 'Technology', description: 'Writes efficient, hand-crafted code (No AI)', points: 100 },
            'prompt-alchemist': { name: 'Prompt Alchemist', icon: '🔮', color: '#9b59b6', category: 'Technology', description: 'Mastery of Generative AI prompting', points: 60 },
            'vibe-coder': { name: 'Vibe Coder', icon: '🌊', color: '#00bcd4', category: 'Technology', description: 'Rapid prototyping using AI tools (Flow State)', points: 60 },
            'tech-innovator': { name: 'Tech Innovator', icon: '💡', color: '#f39c12', category: 'Technology', description: 'Contributed novel technology solutions', points: 100 },
            'ml-specialist': { name: 'ML Specialist', icon: '🤖', color: '#8e44ad', category: 'Technology', description: 'Demonstrated machine learning expertise', points: 100 },
            'gamification-expert': { name: 'Gamification Expert', icon: '🎮', color: '#9b59b6', category: 'Technology', description: 'Specialist in engagement and gamification', points: 60 },

            // COMMUNITY (6)
            'new-recruit': { name: 'New Recruit (Lvl I)', icon: '🌱', color: '#b2dfdb', category: 'Community', description: 'Active member for > 1 month', points: 20 },
            'semester-survivor': { name: 'Semester Survivor (Lvl II)', icon: '⚓', color: '#4db6ac', category: 'Community', description: 'Active member for > 1 semester (4 months)', points: 100 },
            'yearling': { name: 'Yearling (Lvl III)', icon: '📆', color: '#009688', category: 'Community', description: 'Active member for > 1 year', points: 250 },
            'haag-legacy': { name: 'HAAG Legacy (Lvl IV)', icon: '🦕', color: '#004d40', category: 'Community', description: 'Active member for > 2 years', points: 500 },
            'community-builder': { name: 'Community Builder', icon: '🤝', color: '#e74c3c', category: 'Community', description: 'Active participant in 5+ sub-communities', points: 60 },
            'mentor': { name: 'Mentor', icon: '👨‍🏫', color: '#34495e', category: 'Community', description: 'Helped 20+ researchers with queries', points: 40 },

            // SPECIAL (2)
            'phd-student': { name: 'PhD Student', icon: '🐊', color: '#FF6B00', category: 'Special', description: 'Verified doctoral student in conservation/ecology', points: 200 },
            'conservation-hero': { name: 'Conservation Hero', icon: '🦋', color: '#1abc9c', category: 'Special', description: 'Made significant real-world conservation impact', points: 120 },

            // ADMIN (1)
            'haag-admin': { name: 'HAAG Admin', icon: '👑', color: '#8B0000', category: 'Admin', description: 'Administrator of the HAAG platform', points: 500 }
        };

        const userBadges = {
            'dima': ['research-pioneer', 'data-analyst', 'progress-tracker', 'mentor'],
            'leyang': ['tech-innovator', 'ml-specialist', 'community-builder', 'gamification-expert'],
            'jamesthesnake': ['haag-admin', 'research-pioneer', 'conservation-hero', 'tech-innovator', 'field-expert'],
            'charlie': ['phd-student', 'research-pioneer'],
            'haag_tester': ['cs8903-researcher', 'active-voice', 'code-artisan', 'new-recruit']
        };

        const userSpecializations = {
            'dima': 'Research Progress Tracking',
            'leyang': 'Gamification & Engagement',
            'jamesthesnake': 'Conservation Technology & Administration',
            'charlie': 'PhD Student - Gator Research',
            'haag_tester': 'Academic Research'
        };

        const userStats = {
            'dima': { level: 'Expert', points: 310, posts: 15 },
            'leyang': { level: 'Expert', points: 320, posts: 12 },
            'jamesthesnake': { level: 'Admin', points: 950, posts: 3 },
            'charlie': { level: 'PhD Student', points: 350, posts: 8 },
            'haag_tester': { level: 'Intermediate', points: 270, posts: 35 }
        };

        // Render all badges
        function renderBadges() {
            const badgeGrid = document.getElementById('badgeGrid');
            
            // Group badges by category
            const categories = {};
            Object.values(badges).forEach(badge => {
                if (!categories[badge.category]) {
                    categories[badge.category] = [];
                }
                categories[badge.category].push(badge);
            });

            // Render by category
            Object.entries(categories).forEach(([category, categoryBadges]) => {
                const categoryHeader = document.createElement('h3');
                categoryHeader.style.gridColumn = '1 / -1';
                categoryHeader.style.color = '#2c7a3f';
                categoryHeader.style.marginTop = '20px';
                categoryHeader.style.borderBottom = '2px solid #e8f4ea';
                categoryHeader.style.paddingBottom = '10px';
                categoryHeader.textContent = `${category} Badges`;
                badgeGrid.appendChild(categoryHeader);

                categoryBadges.forEach(badge => {
                    const card = document.createElement('div');
                    card.className = 'badge-card';
                    card.style.borderColor = badge.color;
                    
                    card.innerHTML = `
                        <div class="badge-icon" style="color: ${badge.color}">${badge.icon}</div>
                        <div class="badge-name">${badge.name}</div>
                        <div class="badge-category" style="color: ${badge.color}">${badge.points} Points</div>
                        <div class="badge-description">${badge.description}</div>
                    `;
                    
                    badgeGrid.appendChild(card);
                });
            });
        }

        // Render user profiles
        function renderUsers() {
            const userGrid = document.getElementById('userGrid');
            
            Object.entries(userBadges).forEach(([username, badgeList]) => {
                const userInfo = userStats[username];
                const specialty = userSpecializations[username];
                
                const card = document.createElement('div');
                card.className = 'user-card';
                
                const badgesHtml = badgeList.map(badgeId => {
                    const badge = badges[badgeId];
                    return `
                        <div class="mini-badge" style="background: ${badge.color}" title="${badge.name} - ${badge.description}">
                            <div class="mini-badge-icon">${badge.icon}</div>
                            <div>${badge.name}</div>
                        </div>
                    `;
                }).join('');
                
                card.innerHTML = `
                    <div class="user-header">
                        <div class="user-avatar">${username.charAt(0).toUpperCase()}</div>
                        <div class="user-info">
                            <h3>${username}</h3>
                            <div class="user-specialty">${specialty}</div>
                        </div>
                    </div>
                    
                    <div class="user-stats">
                        <div class="stat">
                            <div class="stat-value">${userInfo.level}</div>
                            <div class="stat-label">Level</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${userInfo.points}</div>
                            <div class="stat-label">Points</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${badgeList.length}</div>
                            <div class="stat-label">Badges</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${userInfo.posts}</div>
                            <div class="stat-label">Posts</div>
                        </div>
                    </div>
                    
                    <div class="user-badges">${badgesHtml}</div>
                `;
                
                userGrid.appendChild(card);
            });
        }

        // Calculate and display statistics
        function renderStats() {
            const totalBadges = Object.keys(badges).length;
            const totalUsers = Object.keys(userBadges).length;
            const totalPoints = Object.values(userStats).reduce((sum, user) => sum + user.points, 0);
            const totalUserBadges = Object.values(userBadges).reduce((sum, badges) => sum + badges.length, 0);
            const avgBadges = (totalUserBadges / totalUsers).toFixed(1);
            
            document.getElementById('totalBadges').textContent = totalBadges;
            document.getElementById('totalUsers').textContent = totalUsers;
            document.getElementById('totalPoints').textContent = totalPoints;
            document.getElementById('avgBadges').textContent = avgBadges;
        }

        // Initialize
        renderBadges();
        renderUsers();
        renderStats();
    </script>
</body>
</html>
