<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAAG Badge Viewer - No Docker Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .section h2 {
            color: #2c7a3f;
            margin-bottom: 20px;
            border-bottom: 3px solid #2c7a3f;
            padding-bottom: 10px;
        }
        
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .badge-card {
            border: 2px solid;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        
        .badge-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .badge-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .badge-name {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #2d3436;
        }
        
        .badge-category {
            text-align: center;
            font-size: 0.85rem;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .badge-description {
            text-align: center;
            font-size: 0.9rem;
            color: #636e72;
            line-height: 1.4;
        }
        
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .user-card {
            background: linear-gradient(135deg, #f8fdf9 0%, #e8f4ea 100%);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid #2c7a3f;
            box-shadow: 0 4px 15px rgba(44, 122, 63, 0.1);
        }
        
        .user-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c7a3f, #4a9d5f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-right: 15px;
        }
        
        .user-info h3 {
            font-size: 1.3rem;
            color: #2c7a3f;
            margin-bottom: 5px;
        }
        
        .user-specialty {
            font-size: 0.9rem;
            color: #636e72;
            font-style: italic;
        }
        
        .user-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c7a3f;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #636e72;
            text-transform: uppercase;
        }
        
        .user-badges {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .mini-badge {
            padding: 10px 5px;
            border-radius: 10px;
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            transition: transform 0.2s ease;
        }
        
        .mini-badge:hover {
            transform: scale(1.1);
        }
        
        .mini-badge-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .stats-summary {
            background: linear-gradient(135deg, #2c7a3f, #4a9d5f);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .stats-summary h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .summary-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .summary-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .summary-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 HAAG Badge System Viewer</h1>
        
        <div class="section">
            <h2>📋 All Available Badges</h2>
            <div class="badge-grid" id="badgeGrid"></div>
        </div>
        
        <div class="section">
            <h2>👥 User Profiles & Achievements</h2>
            <div class="user-grid" id="userGrid"></div>
            
            <div class="stats-summary">
                <h3>📊 System Statistics</h3>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-number" id="totalBadges">0</div>
                        <div class="summary-label">Total Badges</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-number" id="totalUsers">0</div>
                        <div class="summary-label">Active Users</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-number" id="totalPoints">0</div>
                        <div class="summary-label">Total Points</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-number" id="avgBadges">0</div>
                        <div class="summary-label">Avg Badges/User</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Badge definitions from badge-inline.js
        const badges = {
            'research-pioneer': { name: 'Research Pioneer', icon: '🔬', color: '#2c7a3f', category: 'Research', description: 'Started 5+ research discussions' },
            'progress-tracker': { name: 'Progress Tracker', icon: '📈', color: '#ff6b35', category: 'Research', description: 'Research progress tracking specialist' },
            'gamification-expert': { name: 'Gamification Expert', icon: '🎮', color: '#9b59b6', category: 'Technology', description: 'Gamification and engagement specialist' },
            'data-analyst': { name: 'Data Analyst', icon: '📊', color: '#3498db', category: 'Research', description: 'Posted 10+ data analysis insights' },
            'field-expert': { name: 'Field Expert', icon: '🌲', color: '#27ae60', category: 'Research', description: 'Shared field research experiences' },
            'tech-innovator': { name: 'Tech Innovator', icon: '💡', color: '#f39c12', category: 'Technology', description: 'Contributed technology solutions' },
            'community-builder': { name: 'Community Builder', icon: '🤝', color: '#e74c3c', category: 'Community', description: 'Active in 5+ communities' },
            'mentor': { name: 'Mentor', icon: '👨‍🏫', color: '#34495e', category: 'Community', description: 'Helped 20+ researchers' },
            'conservation-hero': { name: 'Conservation Hero', icon: '🦋', color: '#1abc9c', category: 'Conservation', description: 'Made significant conservation impact' },
            'ml-specialist': { name: 'ML Specialist', icon: '🤖', color: '#8e44ad', category: 'Technology', description: 'Machine learning expertise' },
            'haag-admin': { name: 'HAAG Admin', icon: '👑', color: '#8B0000', category: 'Admin', description: 'HAAG platform administrator' },
            'phd-student-gator': { name: 'PhD Student', icon: '🐊', color: '#FF6B00', category: 'Academic', description: 'PhD student in conservation/ecology' }
        };

        const userBadges = {
            'dima': ['research-pioneer', 'progress-tracker', 'data-analyst', 'mentor'],
            'leyang': ['gamification-expert', 'tech-innovator', 'community-builder', 'ml-specialist'],
            'jamesthesnake': ['research-pioneer', 'tech-innovator', 'conservation-hero', 'field-expert', 'haag-admin'],
            'charlie': ['phd-student-gator', 'research-pioneer']
        };

        const userSpecializations = {
            'dima': 'Research Progress Tracking',
            'leyang': 'Gamification & Engagement',
            'jamesthesnake': 'Conservation Technology & Administration',
            'charlie': 'PhD Student - Gator Research'
        };

        const userStats = {
            'dima': { level: 'Expert', points: 1250, posts: 15 },
            'leyang': { level: 'Expert', points: 1100, posts: 12 },
            'jamesthesnake': { level: 'Admin', points: 950, posts: 3 },
            'charlie': { level: 'PhD Student', points: 680, posts: 8 }
        };

        // Render all badges
        function renderBadges() {
            const badgeGrid = document.getElementById('badgeGrid');
            
            Object.entries(badges).forEach(([id, badge]) => {
                const card = document.createElement('div');
                card.className = 'badge-card';
                card.style.borderColor = badge.color;
                
                card.innerHTML = `
                    <div class="badge-icon">${badge.icon}</div>
                    <div class="badge-name">${badge.name}</div>
                    <div class="badge-category">${badge.category}</div>
                    <div class="badge-description">${badge.description}</div>
                `;
                
                badgeGrid.appendChild(card);
            });
        }

        // Render user profiles
        function renderUsers() {
            const userGrid = document.getElementById('userGrid');
            
            Object.entries(userBadges).forEach(([username, badgeList]) => {
                const userInfo = userStats[username];
                const specialty = userSpecializations[username];
                
                const card = document.createElement('div');
                card.className = 'user-card';
                
                const badgesHtml = badgeList.map(badgeId => {
                    const badge = badges[badgeId];
                    return `
                        <div class="mini-badge" style="background: ${badge.color}" title="${badge.name} - ${badge.description}">
                            <div class="mini-badge-icon">${badge.icon}</div>
                            <div>${badge.name}</div>
                        </div>
                    `;
                }).join('');
                
                card.innerHTML = `
                    <div class="user-header">
                        <div class="user-avatar">${username.charAt(0).toUpperCase()}</div>
                        <div class="user-info">
                            <h3>${username}</h3>
                            <div class="user-specialty">${specialty}</div>
                        </div>
                    </div>
                    
                    <div class="user-stats">
                        <div class="stat">
                            <div class="stat-value">${userInfo.level}</div>
                            <div class="stat-label">Level</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${userInfo.points}</div>
                            <div class="stat-label">Points</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${badgeList.length}</div>
                            <div class="stat-label">Badges</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${userInfo.posts}</div>
                            <div class="stat-label">Posts</div>
                        </div>
                    </div>
                    
                    <div class="user-badges">${badgesHtml}</div>
                `;
                
                userGrid.appendChild(card);
            });
        }

        // Calculate and display statistics
        function renderStats() {
            const totalBadges = Object.keys(badges).length;
            const totalUsers = Object.keys(userBadges).length;
            const totalPoints = Object.values(userStats).reduce((sum, user) => sum + user.points, 0);
            const totalUserBadges = Object.values(userBadges).reduce((sum, badges) => sum + badges.length, 0);
            const avgBadges = (totalUserBadges / totalUsers).toFixed(1);
            
            document.getElementById('totalBadges').textContent = totalBadges;
            document.getElementById('totalUsers').textContent = totalUsers;
            document.getElementById('totalPoints').textContent = totalPoints;
            document.getElementById('avgBadges').textContent = avgBadges;
        }

        // Initialize
        renderBadges();
        renderUsers();
        renderStats();
    </script>
</body>
</html>
